<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NewGenBank — seu dinheiro, suas escolhas." />
    <meta name="theme-color" content="#f2efe7" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>NewGenBank</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages restore script
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('ngb2:theme') || 'system';
          const resolved = saved === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : saved;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = saved;
        } catch {}
        let accent = 'green';
        try {
          const savedAccent = localStorage.getItem('ngb2:accent');
          if (['green', 'electric-blue', 'violet', 'crimson', 'amber-gold', 'ice-cyan'].includes(savedAccent)) accent = savedAccent;
        } catch {}
        document.documentElement.dataset.accent = accent;
        let motionPreference = 'system';
        try {
          const savedMotion = localStorage.getItem('ngb2:motion');
          if (savedMotion === 'reduced' || savedMotion === 'full') motionPreference = savedMotion;
        } catch {}
        document.documentElement.dataset.reducedMotion = String(
          motionPreference === 'system'
            ? matchMedia('(prefers-reduced-motion: reduce)').matches
            : motionPreference === 'reduced'
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
